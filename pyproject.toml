[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kegg-flux-mapper"
version = "0.2.0"
description = "Overlay constraint-based flux (pFBA/FVA) on KEGG pathway maps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "dash==4.1.0",
    "dash-bootstrap-components==2.0.4",
    "cobra==0.30.0",
    "plotly==6.6.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["kfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: drives the running app in headless Chromium (needs playwright + a server)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
